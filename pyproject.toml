[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx"
version = "0.1.0"
description = "Convert Markdown documents to APA 7 formatted Word documents"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
]

[project.scripts]
md2docx = "md2docx.__main__:main"

[tool.setuptools]
packages = ["md2docx"]

[tool.setuptools.package-data]
md2docx = ["templates/*.docx"]
